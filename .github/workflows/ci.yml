name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    name: Python · lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check dfsi tests
      - run: ruff format --check dfsi tests
      - run: mypy

  python-tests:
    name: Python · unit + integration tests, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # PySpark 3.5 needs JDK 11/17/21 for the Memory stage.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      # Build the real artefacts once, so the tests that need a built Memory
      # layer and a trained model run rather than skip.
      # Sized for the 16 GB runner. The 28-day build peaks at ~10 GB in Spark
      # and ~21 GB in training; two weeks with half the scenarios keeps both
      # well inside it. Two weeks needs the scenario split (the time split
      # wants four: warm-up, fit, calibration, test). The measured results in
      # the README come from the full local build, not from CI.
      - name: Build Memory + train (synthetic, 14 days)
        env:
          DFSI_SPARK_DRIVER_MEMORY: 8g
        run: |
          python -m dfsi.memory.pipeline --days 14
          python -m dfsi.forecaster.train --split scenario --sample-fraction 0.5
      - name: Tests (unit, then the end-to-end integration build)
        run: |
          python -m pytest -m "integration or not integration" \
            --cov --cov-report=term --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml

  ui:
    name: UI · typecheck, unit tests, build, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
